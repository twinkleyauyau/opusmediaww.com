<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus Onboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--font-display:'Anton','Arial Narrow',sans-serif;--font-body:'Archivo',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--ease:cubic-bezier(.22,1,.36,1)}
[data-theme="crimson"]{--bg:#1a1a1a;--surface:#212121;--surface-2:#2b2b2b;--ink:#e8e2d8;--ink-dim:#8f887d;--line:#39352f;--accent:#8a1a1a;--accent-ink:#e8e2d8;--accent-glow:#c2352f;--done:#5f6d4e}
[data-theme="paper"]{--bg:#e8e2d8;--surface:#f2eee7;--surface-2:#ded7ca;--ink:#1a1a1a;--ink-dim:#6f6a60;--line:#cfc7b8;--accent:#8a1a1a;--accent-ink:#f2eee7;--accent-glow:#8a1a1a;--done:#7a8768}
[data-theme="press"]{--bg:#0f0f0f;--surface:#161616;--surface-2:#1f1f1f;--ink:#f4f4f4;--ink-dim:#7d7d7d;--line:#2c2c2c;--accent:#e8e2d8;--accent-ink:#0f0f0f;--accent-glow:#fff;--done:#4d4d4d}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .4s var(--ease),color .4s var(--ease)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-glow);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px 100px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:36px 0 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand h1{font-family:var(--font-display);font-size:clamp(36px,6vw,58px);line-height:.86;text-transform:uppercase}
.brand h1 em{font-style:normal;color:var(--accent)}
[data-theme="press"] .brand h1 em{color:var(--ink)}
.brand .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);margin-top:10px}
.btn{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:11px 16px;border:1px solid var(--line);background:var(--surface);transition:transform .25s var(--ease),border-color .2s}
.btn:hover{border-color:var(--accent-glow);transform:translateX(3px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.15)}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:12px;height:12px;background:var(--accent);border:1px solid var(--ink-dim);display:inline-block;margin-right:9px;vertical-align:-1px}
.cols{display:grid;grid-template-columns:320px 1fr;gap:44px;margin-top:36px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr;gap:30px}}
.panel{border:1px solid var(--line);background:var(--surface);margin-bottom:20px}
.panel h3{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);padding:13px 16px;border-bottom:1px solid var(--line)}
.pb{padding:16px}
label{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 6px}
.field{width:100%;padding:11px 12px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px;outline:none}
.field:focus{border-color:var(--accent-glow)}
.field::placeholder{color:var(--ink-dim);opacity:.75}
.rail{height:4px;background:var(--surface-2);overflow:hidden;margin:0 0 30px}
.rail-fill{height:100%;width:0;background:var(--accent);transition:width .6s var(--ease);position:relative}
.rail-fill::after{content:'';position:absolute;inset:0;left:auto;width:38px;background:linear-gradient(90deg,transparent,var(--accent-glow))}
.side{margin-bottom:40px}
.side-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.side-head h2{font-family:var(--font-display);font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.side-head .n{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);margin-left:auto}
.side-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:16px}
.item{display:flex;align-items:flex-start;gap:14px;padding:13px 16px;border:1px solid var(--line);border-top:0;background:var(--surface);position:relative;transition:transform .3s var(--ease),background .2s}
.item:first-of-type{border-top:1px solid var(--line)}
.item:hover,.item:focus-within{transform:translateX(5px);background:var(--surface-2);z-index:40}
.item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);transform:scaleY(0);transform-origin:top;transition:transform .3s var(--ease)}
.item:hover::before{transform:scaleY(1)}
.check{width:19px;height:19px;flex:none;margin-top:2px;border:1.5px solid var(--ink-dim);background:none;display:grid;place-items:center;transition:.2s}
.check:hover{border-color:var(--accent-glow)}
.item.done .check{background:var(--done);border-color:var(--done)}
.check svg{width:11px;height:11px;stroke:var(--bg);stroke-width:3;fill:none;opacity:0;transition:opacity .2s}
.item.done .check svg{opacity:1}
.ib{flex:1;min-width:0}
.item.done .it{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--accent)}
.meta{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.meta .tagx{color:var(--accent-glow)}
.meta .chip{border:1px solid var(--line);padding:1px 5px}
.nw{position:relative;display:inline-flex;vertical-align:middle;margin-left:9px}
.info{width:16px;height:16px;border:1px solid var(--ink-dim);color:var(--ink-dim);font-family:var(--font-mono);font-size:9px;font-weight:600;display:grid;place-items:center;line-height:1;padding:0;transition:.2s}
.nw:hover .info,.nw:focus-within .info{border-color:var(--accent-glow);color:var(--accent-glow)}
.pop{position:absolute;left:-6px;top:24px;width:296px;background:var(--surface-2);border:1px solid var(--accent);padding:13px 14px;font-family:var(--font-mono);font-size:10px;line-height:1.9;letter-spacing:.03em;color:var(--ink);z-index:50;display:none;text-transform:none;font-weight:400}
.nw:hover .pop,.nw:focus-within .pop{display:block}
.pop a{color:var(--accent-glow);word-break:break-all}
.pop b{color:var(--accent-glow);font-weight:600}
.pop hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.sig{border:1px solid var(--accent);background:var(--surface);margin:0 0 34px}
.sig-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--accent);color:var(--accent-ink);flex-wrap:wrap}
.sig-head h2{font-family:var(--font-display);font-size:20px;text-transform:uppercase}
.tabs{display:flex;margin-left:auto;gap:0;border:1px solid rgba(255,255,255,.3)}
.tab{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:7px 12px;color:var(--accent-ink);opacity:.7}
.tab.on{background:var(--accent-ink);color:var(--accent);opacity:1}
.sig-body{padding:18px 16px}
.preview{background:#fff;padding:24px;border:1px solid var(--line);overflow-x:auto}
.sig-acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.hint{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-dim);margin-top:12px;line-height:1.8}
.ref{border:1px solid var(--line);background:var(--surface);margin:0 0 34px}
.ref h2{font-family:var(--font-display);font-size:20px;text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--line)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;background:var(--line)}
.tool{background:var(--surface);padding:14px 16px}
.tool .tn{font-weight:600;font-size:14px}
.tool .td{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-top:4px}
.rituals{padding:16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:620px){.rituals{grid-template-columns:1fr}}
.ritual .rn{font-family:var(--font-display);font-size:17px;text-transform:uppercase}
.ritual .rf{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-glow);margin:4px 0 6px}
.ritual .rd{font-size:13px;color:var(--ink-dim)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120%);background:var(--accent);color:var(--accent-ink);padding:13px 22px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;z-index:60;transition:transform .45s var(--ease)}
.toast.on{transform:translate(-50%,0)}
@media print{.info{display:none}.pop{display:block!important;position:static;width:auto;border:0;border-left:2px solid #999;padding:2px 0 2px 8px;margin-top:6px;background:none}
body{background:#fff;color:#000}.top-actions,.sig-acts,.tabs,aside,.rail{display:none}.item,.panel,.sig,.ref,.tool{border-color:#ccc!important;background:#fff!important}.item:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Opus <em>Onboard</em></h1>
      <div class="tag">We make brands move · new joiner setup</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="theme"><span class="swatch"></span><span id="theme-name">Paper</span></button>
    </div>
  </header>

  <div class="cols">
    <aside>
      <div class="panel">
        <h3>New joiner</h3>
        <div class="pb">
          <label for="f-first">First name</label>
          <input class="field" id="f-first" placeholder="e.g. Twinkle">
          <label for="f-last">Last name</label>
          <input class="field" id="f-last" placeholder="e.g. Chan">
          <label for="f-title">Job title</label>
          <input class="field" id="f-title" placeholder="e.g. Digital Director">
          <label for="f-email">Email</label>
          <input class="field" id="f-email" placeholder="e.g. twinkle.chan@opusmediaww.com">
          <label for="f-phone">Mobile</label>
          <input class="field" id="f-phone" placeholder="e.g. +852 53456758">
          <label for="f-office">Office</label>
          <select class="field" id="f-office">
            <option value="hk">Hong Kong</option>
            <option value="sg">Singapore</option>
            <option value="sh">Shanghai</option>
          </select>
          <label for="f-start">Start date</label>
          <input class="field" id="f-start" type="date">
        </div>
      </div>
      <div class="panel">
        <h3>Where it stands</h3>
        <div class="pb" id="summary"></div>
      </div>
    </aside>

    <main>
      <div class="rail"><div class="rail-fill" id="rail"></div></div>
      <div id="out"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

function iconRow(icon, html){

<td style="vertical-align:middle;font-family:Helvetica,Arial,sans-serif;font-size:9pt;color:${C.ink};white-space:nowrap;">${html}</td>`;

const link = (href,text,col) => `<a href="${href}" style="color:${col};text-decoration:none;">${text}</a>`;

function sigReply(p){

const sigHTML = p => sigMode==="full" ? sigFull(p) : sigReply(p);

async function copySig(){
  const html=sigHTML(person()), text=$("preview").innerText;
  try{
    await navigator.clipboard.write([new ClipboardItem({
      "text/html":new Blob([html],{type:"text/html"}),
      "text/plain":new Blob([text],{type:"text/plain"})})]);
    toast("Copied — paste into Outlook");
  }catch{
    const r=document.createRange();r.selectNodeContents($("preview"));
    const s=getSelection();s.removeAllRanges();s.addRange(r);
    document.execCommand("copy");s.removeAllRanges();
    toast("Copied");
  }
}
function downloadSig(){
  const p=person();
  const doc=`<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${sigHTML(p)}</body></html>`;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));
  a.download=`${p.name.replace(/\s+/g,"-").toLowerCase()}-signature-${sigMode}.htm`;
  a.click();URL.revokeObjectURL(a.href);
  toast("Downloaded");
}

}

        <button class="btn" id="dl">Download .htm</button>
      </div>
      <div class="hint">Outlook desktop — File › Options › Mail › Signatures. Set the long one as New messages, the short one as Replies/forwards.<br>
      Outlook web — Settings › Mail › Compose and reply.</div>
    </div></section>`;
}
function refBlock(){
  return `<section class="ref"><h2>Good to know</h2>
    <div class="tools">${TOOLS.map(t=>`<div class="tool"><div class="tn">${esc(t[0])}</div><div class="td">${esc(t[1])}</div></div>`).join("")}</div>
    <div class="rituals">${RITUALS.map(r=>`<div class="ritual"><div class="rn">${esc(r[0])}</div><div class="rf">${esc(r[1])}</div><div class="rd">${esc(r[2])}</div></div>`).join("")}</div>
  </section>`;
}

/* ---------- render ---------- */
function render(){
  const p=person(), c={total:0,hit:0};
  const k = keyFor(p.name, p.email);
  if(k !== storeKey){ storeKey = k; done = loadDone(); }
  const later = LATER[p.office]||[];

  const adminList = ADMIN.concat(later);
  const sect = (key,title,sub,list) => `<section class="side">
      <div class="side-head"><h2>${title}</h2><span class="n">${list.length} items</span></div>
      <div class="side-sub">${sub}</div>
      ${itemsHTML(key,list,c)}
    </section>`;

  let html =
    sect("it","IT","Accounts, laptop and access",IT) +
    sect("admin","Admin","Paperwork and onboarding",adminList) +
    sect("joiner",esc(p.first)+"'s side","What "+esc(p.first)+" does"+(p.start?" · from "+esc(fmt(p.start)):""),JOINER) +
    sigBlock() + refBlock();

  $("out").innerHTML = html;
  $("out").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id; done.has(id)?done.delete(id):done.add(id); saveDone(); render();
  });
  $("out").querySelectorAll("[data-sig]").forEach(b=>b.onclick=()=>{ sigMode=b.dataset.sig; render(); });
  $("preview").innerHTML = sigHTML(p);
  $("copy").onclick = copySig;
  $("dl").onclick = downloadSig;

  $("rail").style.width = c.total ? (c.hit/c.total*100)+"%" : "0%";
  $("summary").innerHTML = `<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);line-height:2">
    <div>${c.hit} of ${c.total} done</div><div>${esc(p.officeLabel)}</div>
    <div>${p.start?esc(fmt(p.start)):"No start date set"}</div></div>`;
}

["f-first","f-last","f-title","f-email","f-phone","f-office","f-start"].forEach(id=>{
  $(id).addEventListener("input",render); $(id).addEventListener("change",render);
});
render();
</script>
</body>
</html>
