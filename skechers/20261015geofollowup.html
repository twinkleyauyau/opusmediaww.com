    tc: {heading:'私人報告',intro:'請輸入 Opus 提供的密碼，以開啟 Skechers 香港網站覆核報告。',label:'報告密碼',show:'顯示密碼',open:'開啟報告',busy:'正在開啟報告…',wrong:'密碼不正確，請重新輸入。',unsupported:'請使用支援的新版瀏覽器，透過 HTTPS 連結開啟報告。'}
  };
  const form=document.getElementById('unlock-form');
  const input=document.getElementById('report-password');
  const button=document.getElementById('unlock-button');
  const message=document.getElementById('gate-message');
  const languageButton=document.getElementById('gate-language');
  let language='en',busy=false,errorKey='';
  const translate=()=>{
    document.documentElement.lang=language==='en'?'en':'zh-Hant';
    document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=translations[language][el.dataset.i18n];});
    button.textContent=translations[language][busy?'busy':'open'];
    message.textContent=errorKey?translations[language][errorKey]:'';
    languageButton.textContent=language==='en'?'繁體中文':'English';
    languageButton.setAttribute('aria-label',language==='en'?'Switch to Traditional Chinese':'Switch to English');
  };
  languageButton.addEventListener('click',()=>{language=language==='en'?'tc':'en';translate();});
  document.getElementById('show-password').addEventListener('change',event=>{input.type=event.target.checked?'text':'password';});
  const decode=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  form.addEventListener('submit',async event=>{
    event.preventDefault();
    if(busy)return;
    errorKey='';
    if(!window.crypto?.subtle){errorKey='unsupported';translate();return;}
    busy=true;button.disabled=true;input.readOnly=true;translate();
    try{
      const payload=JSON.parse(document.getElementById('encrypted-report').textContent);
      const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
      const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv),additionalData:new TextEncoder().encode(payload.aad),tagLength:128},key,decode(payload.ciphertext));
      const report=new TextDecoder('utf-8',{fatal:true}).decode(plaintext);
      input.value='';
      document.open();
      document.write(report);
      document.close();
    }catch(error){
      busy=false;button.disabled=false;input.readOnly=false;errorKey='wrong';translate();input.focus();input.select();
    }
  });
})();
</script>
</body>
</html>
